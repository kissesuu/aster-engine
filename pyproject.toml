[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aster-engine"
version = "0.1.0"
description = "Birth chart computation engine. Facts only, no interpretation."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyswisseph>=2.10.3.2",
    "fastapi>=0.115",
    "timezonefinder>=6.5",
    "tzdata>=2026.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["aster_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
